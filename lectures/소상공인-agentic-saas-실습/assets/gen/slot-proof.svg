  <text x="360" y="463" fill="#f4f4ee" fill-opacity=".58" font-family="Pretendard,sans-serif" font-size="17" text-anchor="middle">디자이너 수진 · 커트 30분</text>
  <g font-family="JetBrains Mono,monospace" font-size="13" letter-spacing="2">
    <text x="86" y="122" fill="#00e054">REQUEST A</text>
    <text x="540" y="592" fill="#ff7272">REQUEST B</text>
    <text x="360" y="650" fill="#f4f4ee" fill-opacity=".42" text-anchor="middle">COLLISION · TIME · OWNERSHIP · ESCALATION</text>
