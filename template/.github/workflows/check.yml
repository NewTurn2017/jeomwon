name: Check
on:
  push:
    paths:
      - '**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run typecheck
      - name: Run linter
        run: bun run lint
      - name: Run tests
        run: bun test
      - name: Build email
        run: bun run build:email
      - name: Build app
        run: bun run build:app
      - name: Build web
        run: bun run build:web
